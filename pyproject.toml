[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datax-eda"
version = "0.1.0"
description = "An offline-first Python EDA library with interactive reports and conversational AI assistance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Datax Developers" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "plotly>=5.10.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
ai-local = [
    "requests>=2.28.0",
]
ai-cloud = [
    "requests>=2.28.0",
]
all = [
    "datax-eda[dev,ai-local,ai-cloud]",
]

[project.urls]
Homepage = "https://github.com/datax-eda/datax"
Documentation = "https://github.com/datax-eda/datax#readme"
Repository = "https://github.com/datax-eda/datax"
Issues = "https://github.com/datax-eda/datax/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/datax"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
